schema_version: 1
uuid: e2ec4337-52d4-4ba1-ac81-a4cfecf8fef7
revision: 1
kind: search_rule
status: active
status_reason: ''
name: Authentik password spraying from a single source
description: 'One address attempting sign-in against many different accounts - the low-and-slow inverse
  of brute force, where each account sees too few failures to trip a per-account threshold.


  The `data.event: "Created Event"` condition is load-bearing, not decoration. authentik emits three separate
  records for one failed sign-in - the audit event, a policy-stage `Invalid credentials` line, and a reputation
  `Updated score` line - and all three carry the `authentication_failed` group. Counting the group alone
  therefore triples every threshold, and two of the three carry no client address at all. `Created Event`
  selects only the audit record: one per attempt, always addressed.


  The diversity constraint is what separates this from rule-1 brute force: ten failures against one account
  is guessing, ten against five accounts is enumeration.


  Volume: never observed on the reference deployment in 30 days.


  Requires a decoder named `authentik` emitting the `authentication_failed` rule group, and the client
  address in `data.srcip`. authentik logs the address as `client_ip`, which is a dynamic field, so it
  must be mapped into the `srcip` static field at the shipping layer for this to match. See Portability
  in the pull request.'
tags:
- authentik
- identity-provider
- password-spraying
- authentication
attack_techniques:
- T1110.003
spec:
  severity: high
  correlation_key: source.ip
  window_minutes: 30
  interval_minutes: 15
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 10
    count_operator: gte
    display_order: 0
    distinct_field: data.dstuser
    min_distinct: 5
    novelty_field: ''
    conditions:
    - field_name: decoder.name
      operator: equals
      value: authentik
    - field_name: rule.groups
      operator: contains
      value: authentication_failed
    - field_name: data.event
      operator: equals
      value: Created Event
  tests:
  - name: fires on failures spread across several accounts
    description: Ten failures from one address against at least five distinct identifiers.
    expect_fire: true
    samples:
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: login_failed
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: bob
        action: login_failed
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: carol
        action: invalid_identifier
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: dave
        action: invalid_identifier
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: erin
        action: login_failed
      agent:
        name: example-host-01
  - name: does not fire on repeated failures against one account
    description: Same volume, one identifier. That is rule-1 brute force, not spraying.
    expect_fire: false
    samples:
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: login_failed
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentication_failed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: login_failed
      agent:
        name: example-host-01
required_fields:
- data.dstuser
- data.event
- data.srcip
- decoder.name
- rule.groups
