    novelty_field: ''
    conditions:
    - field_name: decoder.name
      operator: equals
      value: authentik
    - field_name: rule.groups
      operator: contains
      value: authentication_failed
    - field_name: data.event
      operator: equals
      value: Created Event
    - field_name: rule.mitre.id
      operator: contains
      value: T1110
