name: Authentik password spraying from a single source
description: >-
  One address attempting sign-in against many different accounts - the low-and-slow inverse of brute force,
  where each account sees too few failures to trip a per-account threshold.


  The `data.event: "Created Event"` condition is load-bearing, not decoration. authentik emits three separate
  records for one failed sign-in - the audit event, a policy-stage `Invalid credentials` line, and a reputation
  `Updated score` line - and all three carry the `authentication_failed` group. Counting the group alone therefore
  triples every threshold, and two of the three carry no client address at all. `Created Event` selects only
  the audit record: one per attempt, always addressed.


  The `rule.mitre.id: T1110` condition keeps rejected tokens out. `authentication_failed` is also the natural
  group for authentik's `suspicious_request` (a revoked or invalid token presented, T1550.001), and an OAuth
  client refreshing tokens concurrently produces those in bursts of a dozen or more from one address. That
  is token replay or a client bug, not credential guessing. Both sign-in failure actions (`login_failed`, `invalid_identifier`)
  map to T1110 and a token rejection does not, so the technique selects exactly the attempts this rule is about.
  Added in revision 2, together with the T1110 requirement below.


  The diversity constraint is what separates this from rule-1 brute force: ten failures against one account
  is guessing, ten against five accounts is enumeration.


  Volume: never observed on the reference deployment in 30 days.


  Requires a decoder named `authentik` whose failed sign-in rules carry the `authentication_failed` group and
  MITRE technique T1110, and the client address in `data.srcip`. authentik logs the address as `client_ip`,
  which is a dynamic field, so it must be mapped into the `srcip` static field at the shipping layer for this
  to match. See Portability in the pull request.
tags:
- authentik
- identity-provider
- password-spraying
- authentication
attack_techniques:
- T1110.003
