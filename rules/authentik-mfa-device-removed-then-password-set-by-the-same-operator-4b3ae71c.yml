schema_version: 1
uuid: 4b3ae71c-4f17-40dc-96b2-52e2d35bc6c4
revision: 1
kind: search_rule
status: active
status_reason: ''
name: Authentik MFA device removed then password set by the same operator
description: 'An authenticator device deleted and a password set by the same operator inside an hour -
  the account-takeover sequence, whether run by a compromised admin session or by an attacker who already
  holds a session and is removing the second factor before persisting.


  Correlates on the operator (`data.dstuser`), not the victim: authentik records the acting user on the
  audit event and the affected object under `data.context.model`, which is not a correlation key. A helpdesk
  agent legitimately resetting an account will match this, so treat it as an event worth a question rather
  than an incident.


  Volume: 1 password_set in 30 days on the reference deployment; the pair never observed.


  Requires a decoder named `authentik` emitting audit actions and `data.context.model.app`.'
tags:
- authentik
- identity-provider
- mfa
- account-takeover
attack_techniques:
- T1556.006
- T1098
spec:
  severity: high
  correlation_key: user.name
  window_minutes: 60
  interval_minutes: 30
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 1
    count_operator: gte
    display_order: 0
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - &id001
      field_name: decoder.name
      operator: equals
      value: authentik
    - field_name: data.action
      operator: equals
      value: model_deleted
    - field_name: data.context.model.app
      operator: contains
      value: authentik_stages_authenticator
  - count: 1
    count_operator: gte
    display_order: 1
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - *id001
    - field_name: data.action
      operator: equals
      value: password_set
  tests:
  - name: fires on device removal followed by a password set
    description: Same operator removes an authenticator then sets a password.
    expect_fire: true
    samples:
    - rule:
        groups:
        - authentik
        - account_changed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: model_deleted
        context:
          model:
            model_name: totpdevice
            app: authentik_stages_authenticator_totp
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - account_changed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: password_set
      agent:
        name: example-host-01
  - name: does not fire on a password set alone
    description: An ordinary password change with no preceding device removal.
    expect_fire: false
    samples:
    - rule:
        groups:
        - authentik
        - account_changed
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: password_set
      agent:
        name: example-host-01
required_fields:
- data.action
- data.context.model.app
- data.dstuser
- decoder.name
