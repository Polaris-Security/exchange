name: Burst of out-of-git changes through ArgoCD by one identity
description: >-
  One person changed what ArgoCD deploys, or how ArgoCD itself is configured, through its API three or
  more times in an hour: Application create/update/patch, live-resource patches and resource actions,
  and any write to projects, clusters, repositories, repository credentials, certificates, GPG keys, accounts
  (including API tokens), ApplicationSets or notifications.

  With GitOps the normal path to change any of these is a commit. Each such call is unusual on its own;
  a run of them from one person is someone reshaping the deployment controller by hand - adding a cluster
  or a repository it will trust, minting a token, or pointing an application somewhere new. Manual syncs
  are excluded: they deploy what git already says.

  Requires an argocd-server decoder that extracts the caller's username into the user field and rules
  emitting `argocd` and `config_changed` on those API calls. Without them the artifact imports cleanly
  and never fires.

  Grouping: Polaris evaluates a single-leg rule ungrouped - one fire unit for every matching document,
  whatever the correlation key says. The second leg repeats the first leg's conditions with a count of
  1, which forces the per-key path: both legs must be met by the same key, so the threshold applies per
  person. The split-volume test below proves it.

  Volume on the reference deployment (30 days): zero. It is meant to be silent.
tags:
- argocd
- gitops
- kubernetes
- persistence
- configuration-change
attack_techniques:
- T1098
- T1578
spec:
  severity: medium
  correlation_key: user.name
  window_minutes: 60
  interval_minutes: 30
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 3
    count_operator: gte
    display_order: 0
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - field_name: rule.groups
      operator: contains
      value: config_changed
    - field_name: rule.groups
      operator: contains
      value: argocd
  - count: 1
    count_operator: gte
    display_order: 1
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - field_name: rule.groups
      operator: contains
      value: config_changed
    - field_name: rule.groups
      operator: contains
      value: argocd
  tests:
  - name: fires on three API changes by one person
    description: alice edits an app spec, runs a resource action and mints an API token.
    expect_fire: true
    samples:
    - '@timestamp': now-5m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/UpdateSpec
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-6m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/RunResourceAction
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-7m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /account.AccountService/CreateToken
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
  - name: does not fire when the changes are spread over two people
    description: Two changes each by alice and bob.
    expect_fire: false
    samples:
    - '@timestamp': now-1m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/UpdateSpec
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-2m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/UpdateSpec
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-1m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/UpdateSpec
        dstuser: bob
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-2m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
        - config_changed
      data:
        level: info
        msg: received unary call /application.ApplicationService/UpdateSpec
        dstuser: bob
        grpc:
          request:
            content:
              name: app-a
  - name: does not fire on manual syncs
    description: Syncs are manual operations but not changes to what is deployed.
    expect_fire: false
    samples:
    - '@timestamp': now-1m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
      data:
        level: info
        msg: received unary call /application.ApplicationService/Sync
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-2m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
      data:
        level: info
        msg: received unary call /application.ApplicationService/Sync
        dstuser: alice
        grpc:
          request:
            content:
              name: app-a
    - '@timestamp': now-3m
      agent:
        id: '000'
        name: example-manager-01
      decoder:
        name: argocd
      rule:
        groups:
        - argocd
        - argocd_manual_operation
      data:
        level: info
        msg: received unary call /application.ApplicationService/Sync
        dstuser: alice
        grpc:
          request:
