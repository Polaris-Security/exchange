name: Authentik brute force from a single source
description: >-
  Repeated failed sign-ins to an authentik identity provider from one address inside a short window. Covers
  both halves of credential guessing: `login_failed` (known user, wrong secret) and `invalid_identifier` (username
  does not resolve at all), which authentik reports as distinct actions.


  The `data.event: "Created Event"` condition is load-bearing, not decoration. authentik emits three separate
  records for one failed sign-in - the audit event, a policy-stage `Invalid credentials` line, and a reputation
  `Updated score` line - and all three carry the `authentication_failed` group. Counting the group alone therefore
  triples every threshold, and two of the three carry no client address at all. `Created Event` selects only
  the audit record: one per attempt, always addressed.


  The `rule.mitre.id: T1110` condition keeps rejected tokens out. `authentication_failed` is also the natural
  group for authentik's `suspicious_request` (a revoked or invalid token presented, T1550.001), and an OAuth
  client refreshing tokens concurrently produces those in bursts: revision 1 fired on 14 of them from one in-cluster
  address within two seconds, all one user, all the same revoked refresh token. That is token replay or a client
  bug, not credential guessing, and belongs in its own detection. Both sign-in failure actions map to T1110
  and a token rejection does not, so the technique selects exactly the two actions this rule describes.


  Grouping: Polaris evaluates a single-leg rule ungrouped - one fire unit for every matching document, whatever
  the correlation key says - so revision 1 actually counted failures from all addresses together. The second
  leg repeats the first leg's conditions with a count of 1, which forces the per-key path: both legs must be
  met by the same key, so the threshold applies per source address. The split-volume test below proves it.


  Volume: the reference deployment (one authentik instance, ~40 accounts) saw 9 failed sign-ins in 120 days
  and none in the last 30, so 10 in 15 minutes from one address is far above baseline. An internet-facing IdP
  will need a higher count.


  Requires a decoder named `authentik` whose failed sign-in rules carry the `authentication_failed` group and
  MITRE technique T1110, and the client address in `data.srcip`. authentik logs the address as `client_ip`,
  which is a dynamic field, so it must be mapped into the `srcip` static field at the shipping layer for this
  to match. See Portability in the pull request.
tags:
- authentik
- identity-provider
- brute-force
- authentication
attack_techniques:
- T1110.001
