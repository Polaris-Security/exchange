schema_version: 1
uuid: 596a3636-5031-4f4e-8dde-2caabddf8493
revision: 1
kind: search_rule
status: active
status_reason: ""

name: Kubernetes credential probing by one identity
description: >-
  One Kubernetes API identity is refused access to Secrets, ServiceAccounts or
  RBAC objects five or more times inside an hour.

  This is the shape a compromised workload makes while it works out what its
  ServiceAccount token can reach: the requests are denied, nothing changes, and
  the only trace is a run of 401/403 responses from a single identity. A
  controller with a genuine RBAC gap produces the same pattern, which is worth
  knowing about too - it is an unowned permission error either way.

  Grouped on user.name, so five denials spread across five identities do not
  reach the threshold and one identity probing five resources does.

  Requires a Kubernetes API audit decoder emitting the `kube_audit` rule group,
  with denied access to credential or RBAC objects classified as `kube_denied` -
  see Portability in the pull request. Without those groups this artifact
  imports cleanly and never fires.


  Grouping note: Polaris evaluates a single-leg rule per correlation key only when the leg
  carries a diversity constraint (use_multi = key != none AND (legs > 1 OR has_diversity)).
  Without one it counts documents across all identities and the key is silently ignored, so
  the distinct_field below is what makes this "by one identity" rather than "anywhere on the
  cluster". min_distinct is 1 because the grouping is the point; the distinct values also
  appear in the finding as evidence.

  Volume on the reference deployment (a 6-node k3s cluster, ~16,000 audit
  events/day): 2 such denials in 24h, peak 2 per identity per 30 minutes. At a
  threshold of 5 it is meant to be silent.

tags: [kubernetes, k3s, api-audit, credential-access, rbac]
attack_techniques: [T1552.007, T1613]

spec:
  severity: high
  correlation_key: user.name
  window_minutes: 60
  interval_minutes: 30
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []

  legs:
    - count: 5
      count_operator: gte
      display_order: 0
      distinct_field: data.objectRef.resource
      min_distinct: 1
      novelty_field: ""
      conditions:
        - field_name: rule.groups
          operator: contains
          value: kube_denied
        - field_name: rule.groups
          operator: contains
          value: kube_audit

  tests:
    - name: fires on repeated denials from one identity
      description: >-
        Five refused reads of Secrets by one ServiceAccount inside the window.
        Two samples are shown; the matcher counts documents, so this documents
        the shape rather than the count.
      expect_fire: true
      samples:
        - rule: {groups: [kubernetes, kube_audit, kube_denied]}
          decoder: {name: kube-audit}
          agent: {name: example-host-01}
          data:
            dstuser: system:serviceaccount:example:reporting
            srcip: 192.0.2.10
            verb: get
            objectRef: {resource: secrets, namespace: example, name: example-secret}
            responseStatus: {code: "403"}
        - rule: {groups: [kubernetes, kube_audit, kube_denied]}
          decoder: {name: kube-audit}
          agent: {name: example-host-01}
          data:
            dstuser: system:serviceaccount:example:reporting
            srcip: 192.0.2.10
            verb: list
            objectRef: {resource: clusterrolebindings}
            responseStatus: {code: "403"}
    - name: does not fire on an isolated denial
      description: >-
        A single refused read is an ordinary RBAC gap, not probing.
      expect_fire: false
      samples:
        - rule: {groups: [kubernetes, kube_audit, kube_denied]}
          decoder: {name: kube-audit}
          agent: {name: example-host-01}
          data:
            dstuser: alice
            srcip: 198.51.100.24
            verb: get
            objectRef: {resource: secrets, namespace: example, name: example-secret}
            responseStatus: {code: "403"}

required_fields:
  - data.dstuser
  - data.objectRef.resource
  - rule.groups
