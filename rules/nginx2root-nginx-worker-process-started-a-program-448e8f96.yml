name: 'NGINX2Root: nginx worker process started a program'
description: 'Possible code execution through the NGINX2Root bugs (CVE-2026-123007, CVE-2026-123633, CVE-2026-123634,
  CVE-2026-121810, CVE-2026-113425): a Falco execve event whose parent process is ''nginx: worker process''.
  The researchers call a program started by an nginx worker the clearest sign of compromise. Requires
  Falco events in Wazuh. Plain nginx workers never start programs; some nginx-based products do (e.g.
  BunkerWeb runs ''sh -c'' housekeeping: rm/mkdir/ls under /var/cache/bunkerweb, nginx -t, modsecurity_audit.py),
  so review the command line. curl, wget, a reverse shell or writes to /tmp are an incident. Fixed in
  nginx 1.31.9. Source: https://xint.io/blog/nginx2root-remote-code-execution'
attack_techniques:
- T1190
- T1059.004
tags:
- nginx
- nginx2root
- falco
- CVE-2026-123007
- CVE-2026-123633
- CVE-2026-123634
- CVE-2026-121810
- CVE-2026-113425
