schema_version: 1
uuid: 6bc7b4d0-b754-4152-ba24-af5d84ce8a76
revision: 1
kind: search_rule
status: active
status_reason: ""

name: Low-and-slow password spraying against a mail service
description: >-
  One source address failing authentication against many different mailboxes over
  hours rather than seconds. This is spraying (T1110.003) rather than brute force:
  the attacker walks a dictionary of likely local parts — info@, support@, admin@,
  test@, webmaster@ — trying one or two passwords each, and never generates the
  burst that a rate-based rule looks for.

  The window is deliberately six hours. On the reference deployment the actor that
  motivated this rule averaged well under one attempt per fifteen minutes and never
  touched more than three distinct mailboxes in any single hour. A conventional
  "N failures in 15 minutes" rule — including the SSH brute-force artifact in this
  same repo — is completely silent against it. What separates the attacker from
  ordinary users is not rate, it is the number of *distinct* accounts, which is why
  the leg keys on min_distinct rather than on count alone.

  Requires a decoder whose name contains `mailu` emitting the stock
  `authentication_failed` rule group with `data.srcip` and `data.dstuser`
  populated — see Portability in the pull request. Any mail decoder that does the
  same satisfies it; without one this artifact imports cleanly and never fires.

  Volume: over a six-day window on a single-domain mail server, one source produced
  282 failed authentications across 54 distinct mailboxes, reaching 14 distinct
  mailboxes inside a single six-hour window. Every other source in the same period
  reached at most 3, and all but one reached exactly 1. A threshold of 8 separates
  them with room on both sides. Expect one finding per spraying source, not per
  attempt.

tags:
  - mail
  - smtp
  - imap
  - spraying
  - brute-force
attack_techniques:
  - T1110.003

spec:
  severity: high
  correlation_key: source.ip
  window_minutes: 360
  interval_minutes: 60
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_start: null
  time_window_end: null
  time_window_days: []
  time_window_mode: inside

  legs:
    - count: 8
      count_operator: gte
      display_order: 0
      distinct_field: data.dstuser
      min_distinct: 8
      novelty_field: ""
      conditions:
        - field_name: rule.groups
          operator: contains
          value: authentication_failed
        - field_name: decoder.name
          operator: contains
          value: mailu

  tests:
    - name: fires on failures spread across many mailboxes from one source
      description: >-
        Eight failed authentications from a single address, each against a different
        mailbox. The distinct mailbox count is the signal, so unlike a rate-based
        rule the samples below are the whole point rather than a shorthand: eight
        distinct values of data.dstuser sharing one data.srcip.
      expect_fire: true
      samples:
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: info@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: support@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: admin@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: test@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: webmaster@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: sales@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: billing@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: postmaster@example.com}
          agent: {name: example-host-01}

    - name: does not fire on one user mistyping a password repeatedly
      description: >-
        Eight failures from one address against a single mailbox. This is the shape
        a rate-based brute-force rule is built for and it is explicitly not this
        detection: one distinct value of data.dstuser does not meet min_distinct.
      expect_fire: false
      samples:
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: alice@example.com}
          agent: {name: example-host-01}
        - rule: {groups: ["mail", "mailu_front", "authentication_failed"]}
          decoder: {name: mailu-front}
          data: {srcip: 198.51.100.24, dstuser: alice@example.com}
          agent: {name: example-host-01}

    - name: does not fire on successful logins
      description: A normal authentication carries no authentication_failed group.
      expect_fire: false
      samples:
        - rule: {groups: ["mail", "mailu_dovecot", "authentication_success"]}
          decoder: {name: mailu-dovecot}
          data: {srcip: 198.51.100.24, dstuser: alice@example.com}
          agent: {name: example-host-01}

required_fields:
  - data.dstuser
  - data.srcip
  - decoder.name
  - rule.groups
