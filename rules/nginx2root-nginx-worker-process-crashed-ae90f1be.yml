kind: search_rule
status: active
status_reason: ''
name: 'NGINX2Root: nginx worker process crashed'
description: "Possible exploitation of the NGINX2Root bugs (CVE-2026-123007, -123633, -123634, -121810,\
  \ -113425). A memory-corruption exploit usually crashes nginx workers with SIGSEGV (11) or SIGABRT (6)\
  \ while it works out the memory layout, and nginx logs \"[alert] worker process N exited on signal S\"\
  . Fixed in nginx 1.31.9. Source: https://xint.io/blog/nginx2root-remote-code-execution\n\nRevision 2\
  \ stops treating signal 9 as a crash. Revision 1 matched every \"exited on signal\" line, including\
  \ SIGKILL. A burst of SIGKILLed workers is the OOM killer or a pod/container kill, and on the reference\
  \ deployment it produced a false-positive incident: a node memory stall made the kubelet kill a stale\
  \ proxy pod, and 14 workers exited on signal 9 in one second.\n\nRequires a local Wazuh rule that adds\
  \ the group nginx_worker_crash to nginx error-log events matching\n  ^worker process \\d+ exited on\
  \ signal (?!9\\b)\\d+\nand preferably a sibling that puts signal 9 in a separate group (the reference\
  \ uses nginx_worker_killed) so the availability signal is not lost. Without that rule, this artifact\
  \ imports cleanly and never fires. Any nginx front end works; the reference deployment covers BunkerWeb\
  \ and the Mailu front proxy.\n\nVolume: zero non-SIGKILL worker exits on the reference deployment since\
  \ the rule was written. It is meant to be silent."
attack_techniques:
- T1190
- T1203
tags:
- nginx
- nginx2root
- exploitation
- bunkerweb
- mailu
spec:
  severity: high
  correlation_key: none
  window_minutes: 15
  interval_minutes: 15
  max_findings_per_run: 50
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 1
    count_operator: gte
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    display_order: 0
    conditions:
    - field_name: rule.groups
      operator: equals
      value: nginx_worker_crash
  tests:
  - name: fires on a worker killed by SIGSEGV
    description: 'One worker exiting on signal 11 is enough: a memory-corruption exploit crashes workers
      while it probes the heap layout.'
    expect_fire: true
    samples:
    - data:
        msg: worker process 4242 exited on signal 11 (core dumped)
      rule:
        level: 10
        groups:
        - nginx
        - service_availability
        - nginx_worker_crash
        description: 'nginx: worker process 4242 exited on signal 11 (core dumped)'
      agent:
        id: '000'
        name: example-host-01
      decoder:
        name: nginx-errorlog
      full_log: '2026/11/20 08:33:29 [alert] 39#39: worker process 4242 exited on signal 11 (core dumped)'
  - name: fires on a worker killed by SIGABRT
    description: glibc heap-corruption checks abort the worker with signal 6.
    expect_fire: true
    samples:
    - data:
        msg: worker process 4242 exited on signal 6
      rule:
        level: 10
        groups:
        - nginx
        - service_availability
        - nginx_worker_crash
        description: 'nginx: worker process 4242 exited on signal 6'
      agent:
        id: '000'
        name: example-host-01
      decoder:
        name: nginx-errorlog
      full_log: '2026/11/20 08:33:29 [alert] 39#39: worker process 4242 exited on signal 6'
  - name: does not fire on a SIGKILL burst
    description: Workers SIGKILLed together are the OOM killer or a pod or container kill. The decoder
      puts these in nginx_worker_killed, not nginx_worker_crash.
    expect_fire: false
    samples:
    - data:
        msg: worker process 4242 exited on signal 9
      rule:
        level: 5
        groups:
        - nginx
        - service_availability
        - nginx_worker_killed
        description: 'nginx: worker process 4242 exited on signal 9'
      agent:
        id: '000'
        name: example-host-01
      decoder:
        name: nginx-errorlog
      full_log: '2026/11/20 08:33:29 [alert] 39#39: worker process 4242 exited on signal 9'
    - data:
        msg: worker process 4242 exited on signal 9
      rule:
        level: 5
        groups:
        - nginx
        - service_availability
        - nginx_worker_killed
        description: 'nginx: worker process 4242 exited on signal 9'
      agent:
        id: '000'
        name: example-host-01
      decoder:
        name: nginx-errorlog
      full_log: '2026/11/20 08:33:29 [alert] 39#39: worker process 4242 exited on signal 9'
    - data:
        msg: worker process 4242 exited on signal 9
      rule:
        level: 5
        groups:
        - nginx
        - service_availability
        - nginx_worker_killed
        description: 'nginx: worker process 4242 exited on signal 9'
      agent:
        id: '000'
        name: example-host-01
      decoder:
        name: nginx-errorlog
      full_log: '2026/11/20 08:33:29 [alert] 39#39: worker process 4242 exited on signal 9'
required_fields:
- rule.groups
