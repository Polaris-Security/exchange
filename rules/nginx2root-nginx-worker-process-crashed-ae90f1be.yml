name: 'NGINX2Root: nginx worker process crashed'
description: 'Possible exploitation of the NGINX2Root bugs (CVE-2026-123007, CVE-2026-123633, CVE-2026-123634,
  CVE-2026-121810, CVE-2026-113425): nginx unauthenticated RCE via HTTP/2, HTTP/3, the resolver and the
  mail proxy. Memory-corruption exploits usually crash nginx workers while working out the memory layout.
  Matches nginx''s ''[alert] ... worker process N exited on signal S'' error-log line from any nginx (including
  nginx-based proxies and mail fronts). Signal 11 (SEGV) or 6 (ABRT) is suspicious; a burst of signal
  9 across all workers at once is usually an OOM or container kill. Fixed in nginx 1.31.9. Source: https://xint.io/blog/nginx2root-remote-code-execution'
attack_techniques:
- T1190
tags:
- nginx
- nginx2root
- CVE-2026-123007
- CVE-2026-123633
- CVE-2026-123634
- CVE-2026-121810
- CVE-2026-113425
spec:
  severity: high
  correlation_key: none
  window_minutes: 15
  interval_minutes: 15
  max_findings_per_run: 50
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
