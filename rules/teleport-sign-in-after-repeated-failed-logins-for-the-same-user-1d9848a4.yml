kind: search_rule
status: active
status_reason: ''
name: Teleport sign-in after repeated failed logins for the same user
description: 'Three or more failed Teleport logins and a successful login for the same username within an hour - a guessed
  or stuffed password that eventually worked. Legs are co-occurrence, not sequence.


  Keyed on the username rather than the address on purpose. Teleport records the submitted name on a failure and the same,
  case-sensitive name on success, so the legs agree about who the user is. `addr.remote` on web logins is usually the reverse
  proxy in front of the Teleport proxy, not the client, so a source-address key would merge everyone. Teleport''s own lockout
  (five failures by default) means a real guess campaign shows at most four failures per lock period before the success, which
  is why the threshold sits at three.


  Volume: zero matches in a year of audit history (13,000 events, one human user) at three failures; one at two.


  Requires a Teleport audit stream in Wazuh: Teleport''s `audit_events_uri` with a `stdout://` entry, the container log shipped
  as raw JSON, and rules that tag every Teleport event with the `teleport` group plus the shape group named in the legs. The
  reference decoder and rules (Wazuh 4.14) are linked in the pull request. Teleport''s top-level `user` key lands in `data.dstuser`
  through JSON_Decoder''s static-field routing, so no shipping-layer mapping is needed for the key. Without those groups this
  artifact imports cleanly and never fires.'
tags:
- teleport
- access-proxy
- brute-force
- authentication
attack_techniques:
- T1110
- T1078
spec:
  severity: high
  correlation_key: user.name
  window_minutes: 60
  interval_minutes: 30
  max_findings_per_run: 10
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 3
    count_operator: gte
    display_order: 0
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - field_name: rule.groups
      operator: contains
      value: teleport
    - field_name: rule.groups
      operator: contains
      value: teleport_login_failed
  - count: 1
    count_operator: gte
    display_order: 1
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - field_name: rule.groups
      operator: contains
      value: teleport
    - field_name: rule.groups
      operator: contains
      value: teleport_login
  tests:
  - name: fires on three failures then a success for one user
    description: Three failed logins and a later success under the same username.
    expect_fire: true
    samples:
    - '@timestamp': now-50m
      agent: &id001
        id: '000'
        name: example-manager-01
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-45m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-40m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-10m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login
        - authentication_success
      data:
        dstuser: alice
        method: local
  - name: does not fire when the success is another user
    description: The failures and the success belong to different usernames.
    expect_fire: false
    samples:
    - '@timestamp': now-50m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-45m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-40m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-10m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login
        - authentication_success
      data:
        dstuser: bob
        method: local
  - name: does not fire on two failures then a success
    description: Two typos and a successful login is ordinary use.
    expect_fire: false
    samples:
    - '@timestamp': now-50m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-45m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login_failed
        - authentication_failed
      data:
        dstuser: alice
        method: local
        error: invalid username, password or second factor
    - '@timestamp': now-10m
      agent: *id001
      decoder:
        name: teleport
      rule:
        groups:
        - teleport
        - teleport_audit
        - teleport_login
        - authentication_success
      data:
        dstuser: alice
        method: local
required_fields:
- data.dstuser
- rule.groups
