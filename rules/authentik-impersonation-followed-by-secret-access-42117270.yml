schema_version: 1
uuid: 42117270-490a-4e51-8b89-fc1b00ad6386
revision: 1
kind: search_rule
status: active
status_reason: ''
name: Authentik impersonation followed by secret access
description: 'An administrator starting an impersonation session and then reading a token or certificate
  secret within the hour. Impersonation is a legitimate support tool, and reading a secret is a legitimate
  administrative act; the sequence is what is worth seeing, because impersonation moves the operator into
  someone else''s authorisation context before the secret is read.


  Volume: 3 impersonations and 8 secret reads in 30 days on the reference deployment; the sequence never
  observed.


  Requires a decoder named `authentik` emitting the `impersonation_started` and `secret_view` audit actions.'
tags:
- authentik
- identity-provider
- impersonation
- credential-access
attack_techniques:
- T1548
- T1552
spec:
  severity: high
  correlation_key: user.name
  window_minutes: 60
  interval_minutes: 30
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 1
    count_operator: gte
    display_order: 0
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - &id001
      field_name: decoder.name
      operator: equals
      value: authentik
    - field_name: data.action
      operator: equals
      value: impersonation_started
  - count: 1
    count_operator: gte
    display_order: 1
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - *id001
    - field_name: data.action
      operator: equals
      value: secret_view
  tests:
  - name: fires on impersonation then secret read
    description: Same operator impersonates, then views a secret.
    expect_fire: true
    samples:
    - rule:
        groups:
        - authentik
        - privilege_escalation
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: impersonation_started
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentik_secrets
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: secret_view
      agent:
        name: example-host-01
  - name: does not fire on a secret read alone
    description: Routine administration with no impersonation in the window.
    expect_fire: false
    samples:
    - rule:
        groups:
        - authentik
        - authentik_secrets
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: secret_view
      agent:
        name: example-host-01
required_fields:
- data.action
- data.dstuser
- decoder.name
