schema_version: 1
uuid: 85958e09-25fd-4d85-8f94-4fccb8bed7cb
revision: 1
kind: search_rule
status: active
status_reason: ''
name: Authentik secret enumeration by a single operator
description: 'Five or more token or certificate secrets read by one operator inside fifteen minutes. Reading
  one secret is administration; sweeping the store is collection, and is what an attacker does with a
  stolen admin session before moving laterally to whatever those tokens authenticate.


  Volume: 8 secret reads in 30 days on the reference deployment, never more than two together.


  Requires a decoder named `authentik` emitting the `secret_view` audit action.'
tags:
- authentik
- identity-provider
- secrets
- credential-access
attack_techniques:
- T1552
spec:
  severity: high
  correlation_key: user.name
  window_minutes: 15
  interval_minutes: 15
  max_findings_per_run: 20
  include_agentless: true
  baseline_lookback_days: 30
  time_window_mode: inside
  time_window_start: null
  time_window_end: null
  time_window_days: []
  legs:
  - count: 5
    count_operator: gte
    display_order: 0
    distinct_field: ''
    min_distinct: 1
    novelty_field: ''
    conditions:
    - field_name: decoder.name
      operator: equals
      value: authentik
    - field_name: rule.groups
      operator: contains
      value: authentik_secrets
    - field_name: data.action
      operator: equals
      value: secret_view
  tests:
  - name: fires on a sweep of the secret store
    description: Five secrets read by one operator inside the window.
    expect_fire: true
    samples:
    - rule:
        groups:
        - authentik
        - authentik_secrets
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: secret_view
      agent:
        name: example-host-01
    - rule:
        groups:
        - authentik
        - authentik_secrets
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: secret_view
      agent:
        name: example-host-01
  - name: does not fire on a single secret read
    description: Ordinary administration.
    expect_fire: false
    samples:
    - rule:
        groups:
        - authentik
        - authentik_secrets
      decoder:
        name: authentik
      data:
        event: Created Event
        srcip: 198.51.100.24
        dstuser: alice
        action: secret_view
      agent:
        name: example-host-01
required_fields:
- data.action
- data.dstuser
- decoder.name
- rule.groups
