name: Rebuild index

# index.json is what consuming deployments actually fetch to browse the commons, so it must
# track main exactly. Rebuilt here on every merge rather than trusted to contributors, which
# is also why hand-editing it achieves nothing.
on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "playbooks/**"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Rebuild index.json
        run: python scripts/build_index.py

      - name: Commit if it changed
        run: |
          if git diff --quiet index.json; then
            echo "index.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index.json"
          git push
